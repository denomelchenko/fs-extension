name: Bloglist tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/bloglist_test
      PORT: 3001
      SECRET: ci-only-secret-never-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack install --global pnpm@12.5.1

      - name: Install backend dependencies
        working-directory: bloglist/server
        run: corepack pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: bloglist/client
        run: corepack pnpm install --frozen-lockfile

      - name: Run backend tests
        working-directory: bloglist/server
        run: corepack pnpm test

      - name: Run frontend unit tests
        working-directory: bloglist/client
        run: corepack pnpm test

      - name: Install test dependencies
        working-directory: bloglist-tests
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: bloglist-tests
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: bloglist-tests
        run: corepack pnpm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloglist-playwright-report
          path: bloglist-tests/playwright-report/
          retention-days: 14
