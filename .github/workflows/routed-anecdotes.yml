name: Routed anecdotes tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack install --global pnpm@12.5.1

      - name: Install app dependencies
        working-directory: routed-anecdotes
        run: corepack pnpm install --frozen-lockfile

      - name: Install test dependencies
        working-directory: routed-anecdotes-tests
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: routed-anecdotes-tests
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: routed-anecdotes-tests
        run: corepack pnpm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: routed-anecdotes-tests/playwright-report/
          retention-days: 14
